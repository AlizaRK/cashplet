name: Supabase Keep-Alive

on:
  schedule:
    # Runs every 3 days at 00:00 UTC — well under the ~7 day inactivity window
    - cron: '0 0 */3 * *'
  workflow_dispatch: {}  # lets you manually trigger a run from the Actions tab to test

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}")

          echo "Supabase responded with HTTP $response"

          if [ "$response" -ge 200 ] && [ "$response" -lt 500 ]; then
            echo "✅ Keep-alive ping successful"
          else
            echo "❌ Unexpected response code — check project status"
            exit 1
          fi
